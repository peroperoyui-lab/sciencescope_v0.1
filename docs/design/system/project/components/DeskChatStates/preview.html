<!-- @dsCard group="编辑台" height=640 subtitle="对话标签的其他状态：没有绑定对话、更多菜单、秘书按钮打开任务秘书" -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>DeskChatStates</title></head>
<body>
<div class="ds" style="grid-template-columns:repeat(2,auto);justify-content:start;align-items:start;gap:16px 24px">
  <div class="ds-col"><aside class="ss-panel" style="width:330px;height:420px;position:relative">
      <div class="ss-panel__head" style="padding-left:8px"><nav class="ss-tabs" role="tablist" aria-label="侧栏" style="align-self:stretch"><button class="ss-tab" role="tab" type="button" aria-selected="false">批注与索引</button><button class="ss-tab" role="tab" type="button" aria-selected="true">对话</button></nav><span style="flex:1"></span><button class="ss-icon-btn" type="button" aria-label="关闭侧栏" data-tip="关闭侧栏"><i data-i="x"></i></button></div>
      <div class="ss-panel__body">
        <div class="ss-empty">
          <div class="ss-empty__icon"><i data-i="message-square-plus"></i></div>
          <div class="ss-empty__title">还没有绑定对话</div>
          <div class="ss-empty__text">绑定后可以在这里和专家讨论这份文稿，秘书也跟着这段对话。</div>
          <div class="ss-empty__actions"><button class="ss-btn ss-btn--primary ss-btn--sm" type="button">接续最近的对话</button><button class="ss-btn ss-btn--sm" type="button">选一个对话…</button></div>
        </div>
      </div>
    </aside><span class="ds-label">① 没有绑定对话：接续项目最近的对话，或选一个</span></div>
  <div class="ds-col"><aside class="ss-panel" style="width:330px;height:420px">
      <div class="ss-panel__head"><button class="ss-icon-btn" type="button" aria-label="回到对话" data-tip="回到对话"><i data-i="arrow-left"></i></button><i data-i="clipboard-list" style="margin:0 6px;color:var(--ink-2)"></i><span class="ss-panel__title">任务秘书 · 第三章：组态分析</span><button class="ss-icon-btn" type="button" aria-label="关闭侧栏" data-tip="关闭侧栏"><i data-i="x"></i></button></div>
      <div class="ss-content ss-desk-chat__thread"><div class="ss-thread ss-thread--panel">
        <div class="ss-msg ss-msg--user"><div class="ss-msg__bubble">把今天在编辑台里定下的改动记进纪要。</div></div>
        <div class="ss-msg"><div class="ss-msg__head"><span class="ss-avatar">秘</span><span class="ss-msg__name">任务秘书</span></div><div class="ss-msg__body"><p>已记入纪要第 4 版：3.2 节缺失值处理改为相邻年份均值；阈值依据待补 Ragin 2008。</p></div></div>
      </div></div>
      <div class="ss-composer-wrap ss-desk-chat__composer"><div class="ss-composer"><textarea class="ss-composer__input" rows="1" placeholder="问秘书，或让它整理纪要…"></textarea><div class="ss-composer__bar"><span class="ss-composer__spacer"></span><button class="ss-send" type="button" aria-label="发送" disabled><i data-i="arrow-up"></i></button></div></div></div>
    </aside><span class="ds-label">② 点秘书按钮：侧栏换成这段对话的任务秘书（和主窗口同一个），左上角回到对话</span></div>
  <div class="ds-col"><div class="ss-menu" data-static role="menu" aria-label="对话" style="min-width:220px">
      <button class="ss-menu__item" type="button" role="menuitem"><i data-i="app-window"></i>在主窗口打开</button>
      <button class="ss-menu__item" type="button" role="menuitem"><i data-i="git-branch"></i>从最新消息开新分支</button>
      <button class="ss-menu__item" type="button" role="menuitem"><i data-i="arrow-left-right"></i>换成别的对话…</button>
    </div><span class="ds-label">③ 头部「更多」：在主窗口打开、从最新消息开新分支、换成别的对话</span></div>
  <div class="ds-col"><div style="display:flex;gap:16px;align-items:center">
      <div class="ss-desk-canvas" style="position:relative;width:120px;height:72px;overflow:hidden;border-radius:var(--r-md)"><button class="ss-desk-orb" type="button" aria-label="秘书" data-tip="这个对话的秘书"><i data-i="clipboard-list"></i></button></div>
      <div class="ss-desk-canvas" style="position:relative;width:120px;height:72px;overflow:hidden;border-radius:var(--r-md)"><button class="ss-desk-orb" type="button" aria-label="秘书" aria-disabled="true" data-tip="绑定对话后才有秘书"><i data-i="clipboard-list"></i></button></div>
    </div><span class="ds-label">④ 正文右上角的秘书按钮；没绑定对话时停用</span></div>
</div>
<script>window.SS && SS.mount(document.body)</script>
</body>
</html>
