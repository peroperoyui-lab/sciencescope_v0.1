<!-- @dsCard group="导航" height=210 subtitle="44px 页头：标题、范围或成员、一行标签、右侧至多三个操作" -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>PageHeader</title></head>
<body>
<div class="ds" style="gap:12px">
  <div class="ds-box" style="overflow:hidden">
    <div class="ss-header">
      <div class="ss-header__title"><span>文献综述框架讨论</span></div>
      <span class="ss-header__sep"></span>
      <span class="ss-avatars" style="align-self:center" data-tip="主专家、方法专家、文献专家"><span class="ss-avatar">主</span><span class="ss-avatar">方</span><span class="ss-avatar">文</span></span>
      <div class="ss-header__actions">
          <button class="ss-icon-btn" type="button" aria-label="查找当前对话" data-tip="查找当前对话" data-kbd="Ctrl F"><i data-i="search"></i></button>
          <button class="ss-icon-btn" type="button" aria-label="项目置顶摘要" aria-expanded="false" data-tip="项目置顶摘要" data-kbd="Alt S"><i data-i="newspaper"></i></button>
          <button class="ss-icon-btn" type="button" aria-label="任务秘书" aria-pressed="true" data-tip="任务秘书" data-kbd="Ctrl J"><i data-i="panel-right"></i></button>
          <button class="ss-icon-btn" type="button" aria-label="更多" data-menu="#m-head"><i data-i="ellipsis"></i></button>
        </div>
    </div>
  </div>
  <div class="ds-box" style="overflow:hidden">
    <div class="ss-header">
      <div class="ss-header__title"><span>工作站</span></div>
      <button class="ss-select ss-select--ghost" type="button" aria-haspopup="menu" data-menu="#m-ws"><i data-i="folder-open"></i><span class="ss-select__value" data-slot="value">城市韧性研究</span><i data-i="chevron-down"></i></button>
      <div class="ss-header__actions"><button class="ss-btn ss-btn--ghost" type="button"><i data-i="git-fork"></i>版本树</button><button class="ss-btn" type="button"><i data-i="file-pen"></i>在编辑台打开</button><button class="ss-icon-btn" type="button" aria-label="更多" data-tip="更多"><i data-i="ellipsis"></i></button></div>
    </div>
  </div>
  <div class="ds-box" style="overflow:hidden">
    <div class="ss-header">
      <button class="ss-icon-btn" type="button" aria-label="返回" data-tip="返回" data-kbd="Alt ←" style="align-self:center;margin-left:-6px"><i data-i="arrow-left"></i></button>
      <div class="ss-header__title"><span>城市韧性评价指标体系构建</span></div>
      <span class="ss-tag" style="align-self:center">PDF</span>
      <div class="ss-header__actions">
        <button class="ss-icon-btn" type="button" aria-label="打开原件" data-tip="打开原件"><i data-i="external-link"></i></button>
        <button class="ss-icon-btn" type="button" aria-label="更多" data-menu="#m-head"><i data-i="ellipsis"></i></button>
      </div>
    </div>
  </div>
</div>
<div class="ss-menu" id="m-head" hidden>
  <button class="ss-menu__item" type="button"><i data-i="pencil"></i>重命名<span class="ss-menu__end">F2</span></button>
  <button class="ss-menu__item" type="button"><i data-i="download"></i>导出</button>
  <div class="ss-menu__sep"></div>
  <button class="ss-menu__item" type="button"><i data-i="archive"></i>归档</button>
</div>
<div class="ss-menu" id="m-ws" hidden>
  <button class="ss-menu__item" role="menuitemradio" aria-checked="true" data-label="城市韧性研究" type="button"><i data-i="folder-open"></i>城市韧性研究<i data-i="check" class="ss-menu__check"></i></button>
  <button class="ss-menu__item" role="menuitemradio" aria-checked="false" data-label="劳动保障政策演化" type="button"><i data-i="folder"></i>劳动保障政策演化<i data-i="check" class="ss-menu__check"></i></button>
</div>
<script>window.SS && SS.mount(document.body)</script>
</body>
</html>
