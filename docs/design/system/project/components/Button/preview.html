<!-- @dsCard group="操作" height=216 subtitle="28px 高，文字不换行，每个视图最多一个主按钮" -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="ds">
  <div class="ds-row">
    <button class="ss-btn ss-btn--primary" type="button">保存</button>
    <button class="ss-btn" type="button"><i data-i="import"></i>导入材料</button>
    <button class="ss-btn ss-btn--ghost" type="button">取消</button>
    <button class="ss-btn ss-btn--danger" type="button"><i data-i="trash-2"></i>删除</button>
    <button class="ss-btn" type="button" aria-haspopup="menu">排序：导入时间<i data-i="chevron-down"></i></button>
  </div>
  <div class="ds-row">
    <button class="ss-btn ss-btn--sm" type="button"><i data-i="refresh-cw"></i>重新解析</button>
    <button class="ss-btn ss-btn--sm ss-btn--ghost" type="button">查看详情</button>
    <button class="ss-btn ss-btn--lg ss-btn--primary" type="button">开始讨论</button>
    <button class="ss-btn" type="button" aria-busy="true"><span class="ss-spin"></span>测试中</button>
    <button class="ss-btn" type="button" disabled>不可用</button>
  </div>
  <div class="ds-row">
    <button class="ss-btn ss-btn--sm ss-btn--auto" type="button"><i data-i="zap"></i>自动化</button>
    <span class="ds-note">暗红只用于自动化执行方式；删除等危险操作用 danger。</span>
  </div>
  <p class="ds-note">主按钮：浅色主题是墨色，深色主题是品牌绿。次要按钮用于大多数操作；幽灵按钮放在工具条和对话框的取消位。图标在文字左边，下拉箭头在右边。</p>
</div>
<script>window.SS && SS.mount(document.body)</script>
</body>
</html>
