<!-- @dsCard group="对话" height=316 subtitle="输入框：执行方式、上下文用量、模型和思考强度都在底栏；发送和停止是同一个按钮" -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Composer</title></head>
<body>
<div class="ds" style="gap:12px">
  <span class="ds-label">有附件，可以发送</span>
  <div class="ss-composer" style="margin:0;max-width:760px">
    <div class="ss-composer__files">
      <span class="ss-file-chip"><i data-i="file"></i><span>indicators.csv</span><button type="button" aria-label="移除"><i data-i="x"></i></button></span>
      <span class="ss-file-chip"><i data-i="book-open"></i><span>S1 城市韧性评价指标体系构建</span><button type="button" aria-label="移除"><i data-i="x"></i></button></span>
    </div>
    <textarea class="ss-composer__input" rows="1" aria-label="消息">把对照结果画成热力图，按一级指标分组</textarea>
    <div class="ss-composer__bar">
      <button class="ss-icon-btn" type="button" aria-label="添加" data-tip="添加文件或资料" data-menu="#m-add"><i data-i="plus"></i></button>
      <button class="ss-btn ss-btn--ghost ss-btn--sm" type="button" aria-haspopup="menu" data-menu="#m-mode1" data-tip="执行方式"><i data-i="shield-check"></i><span data-slot="value">请求批准</span><i data-i="chevron-down"></i></button>
      <span class="ss-composer__spacer"></span>
      <span data-tip="上下文已用 34%（34 万 / 100 万 token）"><i data-ring="34"></i></span>
      <button class="ss-btn ss-btn--ghost ss-btn--sm" type="button" data-tip="模型和思考强度">deepseek-v4-pro · 中<i data-i="chevron-down"></i></button>
      <button class="ss-send" type="button" aria-label="发送" data-tip="发送" data-kbd="Enter" data-send-demo><i data-i="arrow-up"></i></button>
    </div>
  </div>
  <span class="ds-label">回答进行中：同一个按钮变成停止</span>
  <div class="ss-composer" style="margin:0;max-width:760px">
    <textarea class="ss-composer__input" rows="1" placeholder="回复主专家，输入 @ 叫其他专家" aria-label="消息"></textarea>
    <div class="ss-composer__bar">
      <button class="ss-icon-btn" type="button" aria-label="添加" data-tip="添加文件或资料"><i data-i="plus"></i></button>
      <button class="ss-btn ss-btn--ghost ss-btn--sm" type="button" data-tip="执行方式"><i data-i="play"></i><span>常规</span><i data-i="chevron-down"></i></button>
      <span class="ss-composer__spacer"></span>
      <span data-tip="上下文已用 82%，发送后会先整理较早的对话"><i data-ring="82" data-warn="80"></i></span>
      <button class="ss-btn ss-btn--ghost ss-btn--sm" type="button" data-tip="模型和思考强度">deepseek-v4-pro · 高<i data-i="chevron-down"></i></button>
      <button class="ss-send" type="button" aria-label="停止" data-tip="停止" data-kbd="Esc" data-state="running" data-send-demo><span class="ss-send__stop"></span></button>
    </div>
  </div>
</div>
<div class="ss-menu" id="m-add" hidden>
  <button class="ss-menu__item" type="button"><i data-i="paperclip"></i>添加文件<span class="ss-menu__end">Ctrl U</span></button>
  <button class="ss-menu__item" type="button"><i data-i="book-open"></i>引用资料库</button>
  <button class="ss-menu__item" type="button"><i data-i="at-sign"></i>叫其他专家</button>
</div>
<div class="ss-menu" id="m-mode1" hidden style="width:300px">
  <button class="ss-menu__item ss-menu__item--rich" role="menuitemradio" aria-checked="true" type="button" data-label="请求批准" data-icon="shield-check" data-mode="" data-trigger-class="ss-btn ss-btn--ghost ss-btn--sm"><i data-i="shield-check"></i><span class="ss-menu__text"><span>请求批准</span><span class="ss-menu__desc">运行命令、写入项目文件夹、安装包之前先问你</span></span><i data-i="check" class="ss-menu__check"></i></button>
  <button class="ss-menu__item ss-menu__item--rich" role="menuitemradio" aria-checked="false" type="button" data-label="常规" data-icon="play" data-mode="" data-trigger-class="ss-btn ss-btn--ghost ss-btn--sm"><i data-i="play"></i><span class="ss-menu__text"><span>常规</span><span class="ss-menu__desc">直接执行，随时可以停止</span></span><i data-i="check" class="ss-menu__check"></i></button>
</div>
<script>window.SS && SS.mount(document.body)</script>
</body>
</html>
