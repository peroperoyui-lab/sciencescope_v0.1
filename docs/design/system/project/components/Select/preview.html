<!-- @dsCard group="输入" height=260 subtitle="自绘的触发按钮加菜单，不用浏览器原生下拉框" -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Select</title></head>
<body>
<div class="ds">
  <div class="ds-row">
    <button class="ss-select" type="button" aria-haspopup="menu" aria-expanded="false" data-menu="#scope"><span class="ss-select__label">范围</span><span class="ss-select__value" data-slot="value">当前项目</span><i data-i="chevron-down"></i></button>
    <button class="ss-select ss-select--ghost" type="button" aria-haspopup="menu" aria-expanded="false" data-menu="#sort"><i data-i="arrow-down-up"></i><span class="ss-select__value" data-slot="value">导入时间</span><i data-i="chevron-down"></i></button>
    <button class="ss-select ss-select--sm" type="button" aria-haspopup="menu" aria-expanded="false" data-menu="#scope"><span class="ss-select__value" data-slot="value">当前项目</span><i data-i="chevron-down"></i></button>
  </div>
  <div class="ss-menu" data-static style="width:220px">
    <div class="ss-menu__label">资料范围</div>
    <button class="ss-menu__item" role="menuitemradio" aria-checked="true" type="button">当前项目<i data-i="check" class="ss-menu__check"></i></button>
    <button class="ss-menu__item" role="menuitemradio" aria-checked="false" type="button">我的资料<i data-i="check" class="ss-menu__check"></i></button>
    <button class="ss-menu__item" role="menuitemradio" aria-checked="false" type="button">外部资源<i data-i="check" class="ss-menu__check"></i></button>
  </div>
  <div class="ss-menu" id="scope" hidden>
    <div class="ss-menu__label">资料范围</div>
    <button class="ss-menu__item" role="menuitemradio" aria-checked="true" data-label="当前项目" type="button">当前项目<i data-i="check" class="ss-menu__check"></i></button>
    <button class="ss-menu__item" role="menuitemradio" aria-checked="false" data-label="我的资料" type="button">我的资料<i data-i="check" class="ss-menu__check"></i></button>
    <button class="ss-menu__item" role="menuitemradio" aria-checked="false" data-label="外部资源" type="button">外部资源<i data-i="check" class="ss-menu__check"></i></button>
  </div>
  <div class="ss-menu" id="sort" hidden>
    <button class="ss-menu__item" role="menuitemradio" aria-checked="true" data-label="导入时间" type="button">导入时间<i data-i="check" class="ss-menu__check"></i></button>
    <button class="ss-menu__item" role="menuitemradio" aria-checked="false" data-label="标题" type="button">标题<i data-i="check" class="ss-menu__check"></i></button>
    <button class="ss-menu__item" role="menuitemradio" aria-checked="false" data-label="最近打开" type="button">最近打开<i data-i="check" class="ss-menu__check"></i></button>
    <div class="ss-menu__sep"></div>
    <button class="ss-menu__item" type="button"><i data-i="arrow-down-up"></i>倒序</button>
  </div>
</div>
<script>window.SS && SS.mount(document.body)</script>
</body>
</html>
