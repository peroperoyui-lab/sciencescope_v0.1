<!-- @dsCard group="编辑台" height=410 subtitle="浮动工具条（docx/md、tex、PDF、改写中）和版本树的右键菜单" -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>DeskMenus</title></head>
<body>
<div class="ds" style="grid-template-columns:auto 1fr;align-items:start;gap:16px 24px">
  <div class="ds-col">
    <div class="ss-ftb" role="toolbar" style="position:relative;"><div class="ss-ftb__row"><button class="ss-ftb__label" type="button">正文<i data-i="chevron-down"></i></button><span class="ss-ribbon__sep" style="margin:0 2px"></span><button class="ss-icon-btn" type="button" aria-label="加粗 Ctrl B" data-tip="加粗 Ctrl B"><i data-i="bold"></i></button><button class="ss-icon-btn" type="button" aria-label="斜体 Ctrl I" data-tip="斜体 Ctrl I"><i data-i="italic"></i></button><button class="ss-icon-btn" type="button" aria-label="下划线 Ctrl U" data-tip="下划线 Ctrl U"><i data-i="underline"></i></button><button class="ss-icon-btn" type="button" aria-label="上标" data-tip="上标"><i data-i="superscript"></i></button><button class="ss-icon-btn" type="button" aria-label="下标" data-tip="下标"><i data-i="subscript"></i></button><span class="ss-ribbon__sep" style="margin:0 2px"></span><button class="ss-icon-btn" type="button" aria-label="添加批注" data-tip="添加批注"><i data-i="message-square-plus"></i></button><button class="ss-icon-btn" type="button" aria-label="添加索引" data-tip="添加索引"><i data-i="link-2"></i></button><button class="ss-ftb__label" type="button"><i data-i="text-quote"></i>引用到对话</button><button class="ss-icon-btn" type="button" aria-label="更多" data-tip="更多"><i data-i="ellipsis"></i></button></div><div class="ss-ftb__row"><div class="ss-ftb__ask"><i data-i="wand-sparkles"></i><span>告诉主专家怎么改，例如「语气缓和些」</span><span class="ss-kbd">Enter</span></div></div><div class="ss-ftb__chips"><button type="button">润色</button><button type="button">精简</button><button type="button">更正式</button><button type="button">译成英文</button><button type="button">核对数据</button></div></div>
    <span class="ds-label">docx、md：格式一行，改写一行，下面是常用指令；鼠标离开后淡出</span>
    <div class="ss-ftb" role="toolbar" style="position:relative;width:452px"><div class="ss-ftb__row"><button class="ss-ftb__label" type="button">\textbf</button><button class="ss-ftb__label" type="button">\emph</button><button class="ss-icon-btn" type="button" aria-label="转成公式 $…$" data-tip="转成公式 $…$"><i data-i="radical"></i></button><span class="ss-ribbon__sep" style="margin:0 2px"></span><button class="ss-icon-btn" type="button" aria-label="添加批注" data-tip="添加批注"><i data-i="message-square-plus"></i></button><button class="ss-icon-btn" type="button" aria-label="添加索引" data-tip="添加索引"><i data-i="link-2"></i></button><button class="ss-ftb__label" type="button"><i data-i="text-quote"></i>引用到对话</button></div><div class="ss-ftb__row"><div class="ss-ftb__ask"><i data-i="wand-sparkles"></i><span>告诉主专家怎么改，例如「语气缓和些」</span><span class="ss-kbd">Enter</span></div></div></div>
    <span class="ds-label">tex 源码：格式按钮写成命令；改写同上</span>
    <div class="ss-ftb" role="toolbar" style="position:relative;width:360px"><div class="ss-ftb__row"><button class="ss-ftb__label" type="button"><i data-i="highlighter"></i>标记</button><button class="ss-ftb__label" type="button"><i data-i="message-square-plus"></i>批注</button><button class="ss-ftb__label" type="button"><i data-i="link-2"></i>索引</button><button class="ss-ftb__label" type="button"><i data-i="text-quote"></i>引用到对话</button><button class="ss-icon-btn" type="button" aria-label="复制" data-tip="复制"><i data-i="copy"></i></button></div></div>
    <span class="ds-label">PDF：没有格式和改写</span>
    <div class="ss-ftb" role="toolbar" style="position:relative;width:360px"><div class="ss-ftb__row"><div class="ss-ftb__ask" style="color:var(--ink-2)"><span class="ss-spin"></span><span>主专家正在改写这段……</span><button class="ss-btn ss-btn--ghost ss-btn--sm" type="button">停止</button></div></div></div>
    <span class="ds-label">发出改写后：同一位置显示进度，可以停止；改完直接写进正文，弹提示可撤销</span>
  </div>
  <div class="ds-col">
    <div class="ss-menu" data-static role="menu" aria-label="版本 v5" style="min-width:220px">
      <div class="ss-menu__label">v5 · 修改方法部分</div>
      <button class="ss-menu__item" type="button" role="menuitem"><i data-i="eye"></i>打开这一版（只读）</button>
      <button class="ss-menu__item" type="button" role="menuitem"><i data-i="pencil"></i>从这一版开始编辑</button>
      <button class="ss-menu__item" type="button" role="menuitem"><i data-i="git-compare"></i>和正在编辑的 v7 比较</button>
      <button class="ss-menu__item" type="button" role="menuitem"><i data-i="file-diff"></i>和上一版比较</button>
      <div class="ss-menu__sep"></div>
      <button class="ss-menu__item" type="button" role="menuitem"><i data-i="tag"></i>改名和备注…<span class="ss-menu__end">F2</span></button>
      <button class="ss-menu__item" type="button" role="menuitem"><i data-i="star"></i>层级：草稿<span class="ss-menu__end"><i data-i="chevron-right" class="ss-i--sm"></i></span></button>
      <button class="ss-menu__item" type="button" role="menuitem"><i data-i="download"></i>另存为文件…</button>
      <button class="ss-menu__item" type="button" role="menuitem"><i data-i="rotate-cw"></i>用这一版覆盖项目文件…</button>
      <div class="ss-menu__sep"></div>
      <button class="ss-menu__item" type="button" role="menuitem" aria-disabled="true"><i data-i="trash-2"></i>删除（有后续版本，不能删）</button>
    </div>
    <span class="ds-label">版本树里右键一个版本</span>
  </div>
</div>
<script>window.SS && SS.mount(document.body)</script>
</body>
</html>
