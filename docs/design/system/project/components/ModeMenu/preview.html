<!-- @dsCard group="对话" height=292 subtitle="三种执行方式：请求批准、常规、自动化；自动化统一用暗红色" -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>ModeMenu</title></head>
<body>
<div class="ds" style="grid-template-columns:auto 1fr;align-items:start;gap:24px">
  <div class="ds-col">
    <span class="ds-label">试一试：选自动化，输入框会跟着变</span>
    <div class="ss-composer" style="margin:0;width:420px" id="mode-demo">
      <textarea class="ss-composer__input" rows="1" placeholder="回复主专家" aria-label="消息"></textarea>
      <div class="ss-composer__bar">
        <button class="ss-icon-btn" type="button" aria-label="添加" data-tip="添加文件或资料"><i data-i="plus"></i></button>
        <button class="ss-btn ss-btn--ghost ss-btn--sm" type="button" aria-haspopup="menu" data-menu="#m-mode2" data-tip="执行方式"><i data-i="shield-check"></i><span data-slot="value">请求批准</span><i data-i="chevron-down"></i></button>
        <span class="ss-composer__spacer"></span>
        <button class="ss-send" type="button" aria-label="发送" disabled><i data-i="arrow-up"></i></button>
      </div>
    </div>
    <span class="ds-label" style="margin-top:12px">底栏里的三种触发按钮</span>
    <div class="ds-row" style="gap:6px">
      <button class="ss-btn ss-btn--ghost ss-btn--sm" type="button"><i data-i="shield-check"></i>请求批准<i data-i="chevron-down"></i></button>
      <button class="ss-btn ss-btn--ghost ss-btn--sm" type="button"><i data-i="play"></i>常规<i data-i="chevron-down"></i></button>
      <button class="ss-btn ss-btn--auto ss-btn--sm" type="button"><i data-i="zap"></i>自动化<i data-i="chevron-down"></i></button>
    </div>
  </div>
  <div class="ds-col">
    <dl class="ss-props" style="grid-template-columns:72px 1fr;max-width:340px">
      <dt>请求批准</dt><dd>运行命令、改动项目文件夹里的文件、安装包之前先停下来问你。资料库和工作站的改动不用问，它们都有历史版本。新对话默认用这个。</dd>
      <dt>常规</dt><dd>直接执行，不逐条询问，随时可以停止。想长期放行就切到这里，不做「记住本次选择」。</dd>
      <dt>自动化</dt><dd>按目标连续工作，直到完成或你停止；执行规则同常规。</dd>
    </dl>
  </div>
</div>
<div class="ss-menu" id="m-mode2" hidden style="width:300px">
  <button class="ss-menu__item ss-menu__item--rich" role="menuitemradio" aria-checked="true" type="button" data-label="请求批准" data-icon="shield-check" data-mode="" data-trigger-class="ss-btn ss-btn--ghost ss-btn--sm"><i data-i="shield-check"></i><span class="ss-menu__text"><span>请求批准</span><span class="ss-menu__desc">运行命令、写入项目文件夹、安装包之前先问你</span></span><i data-i="check" class="ss-menu__check"></i></button>
  <button class="ss-menu__item ss-menu__item--rich" role="menuitemradio" aria-checked="false" type="button" data-label="常规" data-icon="play" data-mode="" data-trigger-class="ss-btn ss-btn--ghost ss-btn--sm"><i data-i="play"></i><span class="ss-menu__text"><span>常规</span><span class="ss-menu__desc">直接执行，随时可以停止</span></span><i data-i="check" class="ss-menu__check"></i></button>
  <button class="ss-menu__item ss-menu__item--rich ss-menu__item--auto" role="menuitemradio" aria-checked="false" type="button" data-label="自动化" data-icon="zap" data-mode="auto" data-trigger-class="ss-btn ss-btn--auto ss-btn--sm"><i data-i="zap"></i><span class="ss-menu__text"><span>自动化</span><span class="ss-menu__desc">按目标持续工作，直到完成或你停止</span></span><i data-i="check" class="ss-menu__check"></i></button>
</div>
<script>window.SS && SS.mount(document.body)</script>
</body>
</html>
