<!-- @dsCard group="输入" height=640 subtitle="下载源选择：内置几个常用源，用户可以添加、修改、删除自己的源；删掉正在用的源时退回内置默认" -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>SourcePicker</title></head>
<body>
<div class="ds" style="grid-template-columns:auto auto;justify-content:start;align-items:start;gap:24px">
  <div class="ds-col">
<div class="ss-menu" data-static style="width:340px">
  <div class="ss-menu__label">内置</div>
  <div class="ss-menu__item ss-menu__item--rich" role="menuitemradio" tabindex="-1" aria-checked="false"><span class="ss-menu__text"><span>官方 PyPI</span><span class="ss-menu__desc ss-mono">https://pypi.org/simple</span></span><i data-i="check" class="ss-menu__check"></i></div>
  <div class="ss-menu__item ss-menu__item--rich" role="menuitemradio" tabindex="-1" aria-checked="true"><span class="ss-menu__text"><span>清华（国内）</span><span class="ss-menu__desc ss-mono">https://pypi.tuna.tsinghua.edu.cn/simple</span></span><i data-i="check" class="ss-menu__check"></i></div>
  <div class="ss-menu__item ss-menu__item--rich" role="menuitemradio" tabindex="-1" aria-checked="false"><span class="ss-menu__text"><span>阿里云（国内）</span><span class="ss-menu__desc ss-mono">https://mirrors.aliyun.com/pypi/simple</span></span><i data-i="check" class="ss-menu__check"></i></div>
  <div class="ss-menu__sep"></div>
  <div class="ss-menu__label">自己添加的</div>
  <div class="ss-menu__item ss-menu__item--rich" data-active role="menuitemradio" tabindex="-1" aria-checked="false"><span class="ss-menu__text"><span>学校镜像</span><span class="ss-menu__desc ss-mono">https://mirrors.example.edu.cn/pypi/simple</span></span><span class="ss-menu__tools"><button class="ss-icon-btn ss-icon-btn--sm" type="button" aria-label="修改" data-tip="修改" data-dialog="#dlg-source-edit"><i data-i="pencil"></i></button><button class="ss-icon-btn ss-icon-btn--sm" type="button" aria-label="删除" data-tip="删除"><i data-i="trash-2"></i></button></span><i data-i="check" class="ss-menu__check"></i></div>
  <div class="ss-menu__sep"></div>
  <button class="ss-menu__item" type="button" data-dialog="#dlg-source"><i data-i="plus"></i>添加自定义源…</button>
</div>
    <span class="ds-label">下拉框：内置的在上，自己添加的在下，悬停出现修改和删除</span>
  </div>
  <div class="ds-col">
<div class="ss-dialog" data-static style="width:440px" role="dialog" aria-label="添加软件包镜像">
  <div class="ss-dialog__head"><h2 class="ss-dialog__title">添加软件包镜像</h2><button class="ss-icon-btn" type="button" aria-label="关闭" data-tip="关闭" data-kbd="Esc" data-close><i data-i="x"></i></button></div>
  <div class="ss-dialog__body">
    <label class="ss-field"><span class="ss-field__label">名称</span><span class="ss-input"><input value="学校镜像" placeholder="例如 学校镜像" aria-label="名称" /></span></label>
    <label class="ss-field"><span class="ss-field__label">地址</span><span class="ss-input"><i data-i="link"></i><input class="ss-mono" value="https://mirrors.example.edu.cn/pypi/simple" placeholder="https://…/simple" aria-label="地址" /></span><span class="ss-field__hint">填 pip 能用的索引地址，一般以 /simple 结尾。保存前会先试着连一下。</span></label>
  </div>
  <div class="ss-dialog__foot"><button class="ss-btn" type="button" data-close>取消</button><button class="ss-btn ss-btn--primary" type="button" data-close>添加</button></div>
</div>
    <span class="ds-label">添加：名称加地址，保存前试连一次</span>
<div class="ss-dialog" data-static style="width:440px" role="dialog" aria-label="修改「学校镜像」">
  <div class="ss-dialog__head"><h2 class="ss-dialog__title">修改「学校镜像」</h2><button class="ss-icon-btn" type="button" aria-label="关闭" data-tip="关闭" data-kbd="Esc" data-close><i data-i="x"></i></button></div>
  <div class="ss-dialog__body">
    <label class="ss-field"><span class="ss-field__label">名称</span><span class="ss-input"><input value="学校镜像" placeholder="例如 学校镜像" aria-label="名称" /></span></label>
    <label class="ss-field"><span class="ss-field__label">地址</span><span class="ss-input"><i data-i="link"></i><input class="ss-mono" value="https://mirrors.example.edu.cn/pypi/simpel" placeholder="https://…/simple" aria-label="地址" /></span><span class="ss-field__error"><i data-i="circle-alert" class="ss-i--sm"></i>连不上这个地址（超时 10 秒）。请检查地址或网络；确定没错也可以仍然保存。</span></label>
  </div>
  <div class="ss-dialog__foot"><button class="ss-btn" type="button" data-close>取消</button><button class="ss-btn ss-btn--primary" type="button" data-close>仍然保存</button></div>
</div>
    <span class="ds-label">连不上：原因写在地址下面，可以改地址，也可以仍然保存</span>
  </div>
</div>
<script>window.SS && SS.mount(document.body)</script>
</body>
</html>
