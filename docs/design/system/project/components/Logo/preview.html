<!-- @dsCard group="基础" height=184 subtitle="矢量标志跟随文字颜色，浅色和深色主题都清楚；最小 16px" -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Logo</title></head>
<body>
<div class="ds">
  <div class="ds-row" style="gap:28px;align-items:flex-end">
    <div class="ds-col" style="justify-items:center"><i data-logo style="width:64px;height:64px"></i><span class="ds-label">64</span></div>
    <div class="ds-col" style="justify-items:center"><i data-logo style="width:32px;height:32px"></i><span class="ds-label">32</span></div>
    <div class="ds-col" style="justify-items:center"><i data-logo style="width:20px;height:20px"></i><span class="ds-label">20</span></div>
    <div class="ds-col" style="justify-items:center"><i data-logo style="width:16px;height:16px"></i><span class="ds-label">16 最小</span></div>
    <div class="ds-col" style="justify-items:center"><i data-logo style="width:32px;height:32px;color:var(--accent)"></i><span class="ds-label">强调色</span></div>
    <div class="ds-col" style="margin-left:12px">
      <span class="ss-titlebar__brand" style="height:36px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--side)"><i data-logo></i>ScienceScope</span>
      <span class="ds-label">标题栏：18px 标志 + 13px 半粗字名</span>
    </div>
  </div>
  <p class="ds-note">只用 ink 或 accent 两种颜色，不加阴影、描边、渐变或底板。四周留白不少于标志宽度的四分之一。位图原件只在安装包图标和对外材料里使用。</p>
</div>
<script>window.SS && SS.mount(document.body)</script>
</body>
</html>
