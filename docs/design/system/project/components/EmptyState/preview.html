<!-- @dsCard group="反馈" height=272 subtitle="空的时候说清是什么、怎么开始；没有可做的事就只留一句话" -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>EmptyState</title></head>
<body>
<div class="ds ds-cols" style="gap:16px">
  <div class="ds-box">
    <div class="ss-empty">
      <div class="ss-empty__icon"><i data-i="book-open"></i></div>
      <div class="ss-empty__title">还没有资料</div>
      <div class="ss-empty__text">导入 PDF、Word 或网页，专家回答时会引用它们。</div>
      <div class="ss-empty__actions"><button class="ss-btn ss-btn--primary" type="button"><i data-i="import"></i>导入材料</button></div>
    </div>
  </div>
  <div class="ds-box">
    <div class="ss-empty">
      <div class="ss-empty__icon"><i data-i="inbox"></i></div>
      <div class="ss-empty__title">收件箱是空的</div>
      <div class="ss-empty__text">秘书整理出新的记忆时会放在这里，等你确认。</div>
    </div>
  </div>
  <div class="ds-box">
    <div class="ss-empty">
      <div class="ss-empty__icon"><i data-i="search"></i></div>
      <div class="ss-empty__title">没有找到「韧性指数」</div>
      <div class="ss-empty__text">换个关键词，或清除筛选。</div>
      <div class="ss-empty__actions"><button class="ss-btn" type="button">清除筛选</button></div>
    </div>
  </div>
</div>
<script>window.SS && SS.mount(document.body)</script>
</body>
</html>
