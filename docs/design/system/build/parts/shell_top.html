<div class="ss-shell">
  <header class="ss-titlebar">
    <span class="ss-titlebar__brand"><i data-logo></i>ScienceScope</span>
    <button class="ss-titlebar__menu" type="button">文件</button>
    <button class="ss-titlebar__menu" type="button">编辑</button>
    <button class="ss-titlebar__menu" type="button">视图</button>
    <button class="ss-titlebar__menu" type="button">帮助</button>
    <span class="ss-titlebar__spacer"></span>
    <button class="ss-winctl" type="button" aria-label="最小化"><i data-i="minus"></i></button>
    <button class="ss-winctl" type="button" aria-label="最大化"><i data-i="square"></i></button>
    <button class="ss-winctl ss-winctl--close" type="button" aria-label="关闭"><i data-i="x"></i></button>
  </header>
  <div class="ss-shell__body">
    <aside class="ss-sidebar">
      <div class="ss-sidebar__top">
        <button class="ss-nav-item" type="button"><i data-i="square-pen"></i><span class="ss-nav-item__label">新对话</span></button>
        <button class="ss-nav-item" type="button" aria-current="page"><i data-i="book-open"></i><span class="ss-nav-item__label">资料库</span><span class="ss-nav-item__end">8</span></button>
        <button class="ss-nav-item" type="button"><i data-i="box"></i><span class="ss-nav-item__label">工作站</span></button>
        <button class="ss-search-trigger" type="button"><i data-i="search"></i><span class="ss-search-trigger__label">搜索与命令</span><span class="ss-kbd">Ctrl K</span></button>
      </div>
      <div class="ss-sidebar__scroll">
        <div class="ss-side-section" style="margin-top:4px">
          <div class="ss-side-section__head"><span>项目</span><button class="ss-icon-btn ss-icon-btn--sm" type="button" aria-label="新建项目" data-tip="新建项目"><i data-i="plus"></i></button></div>
          <div class="ss-tree">
            <div class="ss-tree-row" aria-expanded="true">
              <button class="ss-tree-row__twisty" type="button" aria-label="收起"><i data-i="chevron-down"></i></button>
              <i data-i="folder-open"></i><span class="ss-tree-row__label">城市韧性研究</span><span class="ss-tree-row__end"></span>
            </div>
            <div class="ss-tree">
              <div class="ss-tree-row ss-tree-row--child"><span class="ss-tree-row__label">文献综述框架讨论</span><span class="ss-tree-row__end"><span class="ss-spin"></span></span></div>
              <div class="ss-tree-row ss-tree-row--child"><span class="ss-tree-row__label">指标体系初稿</span><span class="ss-tree-row__end">2 天</span></div>
              <div class="ss-tree-row ss-tree-row--child"><span class="ss-tree-row__label">面板数据清洗</span><span class="ss-tree-row__end">5 天</span></div>
            </div>
            <div class="ss-tree-row" aria-expanded="false">
              <button class="ss-tree-row__twisty" type="button" aria-label="展开"><i data-i="chevron-down"></i></button>
              <i data-i="folder"></i><span class="ss-tree-row__label">劳动保障政策演化</span><span class="ss-tree-row__end"></span>
            </div>
          </div>
        </div>
        <div class="ss-side-section">
          <div class="ss-side-section__head"><span>独立对话</span></div>
          <div class="ss-tree">
            <div class="ss-tree-row ss-tree-row--leaf"><span class="ss-tree-row__label">参考文献格式整理</span><span class="ss-tree-row__end">昨天</span></div>
            <div class="ss-tree-row ss-tree-row--leaf"><span class="ss-tree-row__label">Zipf 定律推导</span><span class="ss-tree-row__end">3 天</span></div>
          </div>
        </div>
      </div>
      <div class="ss-sidebar__foot">
        <button class="ss-user" type="button"><span class="ss-avatar ss-avatar--lg ss-avatar--user">Y</span><span class="ss-truncate">Yui</span></button>
        <button class="ss-icon-btn" type="button" aria-label="专家" data-tip="专家"><i data-i="users"></i></button>
        <button class="ss-icon-btn" type="button" aria-label="设置" data-tip="设置"><i data-i="settings"></i></button>
      </div>
      <div class="ss-splitter ss-splitter--end" data-min="200" data-max="360" data-default="248"></div>
    </aside>
