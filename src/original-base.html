function home(){return `<div class="home"><div class="homehero"><img src="${window.LOGO_SRC||'assets/logo-mark.png'}" alt=""><h1>要在 ${esc(S.project)} 里研究什么？</h1><p>Joy，从一个问题开始，和你的研究小组一起推进。</p></div><div class="card recent"><div class="between tight"><h3 style="margin:0">最近工作</h3><button class="linklike" data-route="projects">更多项目 ${ic('right')}</button></div>${[['理论与方法核查','58 秒前'],['稿件修改讨论','2 小时前'],['需求画像整理','昨天']].map((r,i)=>`<button class="listrow" data-route="${i===2?'projects':'work'}" style="width:100%;text-align:left">${ic('chat')}<span class="grow">${i===2?'高校专业与技能需求':'城市就业韧性'} <span class="muted">/</span> ${r[0]}</span><small>${r[1]}</small></button>`).join('')}</div><div><div class="between"><small>常用学术站点</small>${ib('more','sites','管理站点')}</div><div class="sites">${S.sites.map(x=>`<button class="site" data-action="open-site" data-site="${x}">${x}</button>`).join('')}${ib('plus','add-site','新增站点')}</div></div><div class="spacer"></div>${composer()}<small style="text-align:center">选择材料、提出问题，或者从最近工作继续。</small></div>`}
function message(name,role,text,extra=''){return `<article class="message"><div class="messagehead"><span class="avatar">${name.slice(0,1)}</span>${esc(name)} <small style="font-weight:400">${esc(role)}</small></div><div class="messagebody">${text}${extra}</div></article>`}
function tool(title,detail,open=false){return `<details class="tool" ${open?'open':''}><summary>${ic('check')}<span class="grow">${title}</span><small>示例活动</small>${ic('down')}</summary><pre>${esc(detail)}</pre><button class="linklike" data-route="run">查看运行详情 →</button></details>`}
function artifact(name='研究稿_v7.md'){return `<div class="artifact">${ic('file')}<span class="grow"><strong style="font-size:12px">${name}</strong><br><small>项目文件 · 可查看版本</small></span>${ib('eye','preview','预览文件')}${ib('more','file-menu','文件操作')}</div>`}
function chat(){const free=route==='free',ordered=route==='ordered';let side=['secretary','compose','overview','preview','diff','context'].includes(route)?route:'';return `<div class="chatlayout"><div class="chatcol">${free?`<div class="panelhead row"><small>当前参与</small>${S.experts.slice(0,3).map(x=>badge(x.name+' · '+x.role,'fill')).join('')}<span class="spacer"></span>${btn('邀请专家','invite','tiny')}</div>`:''}${ordered?`<div class="panelhead"><div class="row"><small>发言顺序</small>${S.queue.map((x,i)=>`<span class="tag ${i===0?'fill':''}">${i+1} ${x}</span>`).join('')}<span class="spacer"></span>${btn('调整顺序','queue','tiny')}${btn('开始一轮','demo-run','tiny primary')}</div></div>`:''}<div class="messages"><div class="message user"><div class="messagehead">Joy</div>先看看第三部分的理论解释是否足够扎实。我想听不同意见，先讨论，不急着改全文。</div>${message('Marin','主专家','<p>我先把需要讨论的问题收拢到两点：当前表述是否符合证据强度，以及方法选择的适用条件是否交代清楚。</p><p>建议先核查“显著促进”这处措辞，再请 Rosalin 看材料依据，Jacob 检查是否遗漏替代解释。具体采用哪种修订，由你决定。</p>',tool('查看材料与上一版说明','读取：paper_versions/研究稿_v7.md\n参考：研究稿_v6.notes.md\n这是设计稿中的示例工具记录。'))}${message('Rosalin','客座专家','<p>从文稿结构看，理论陈述和实证结果需要更紧密对应。建议把研究假设、方法适用范围与结论分开表达。</p>',artifact())}${message('Jacob','审阅专家','<p>我会重点查看推断的边界。你可以在右侧选出不确定的语句，先向秘书提问，或直接附上修改意见。</p>',tool('子代理：材料复核员 · 1 / 1','所属专家：Jacob\n本次工作：核对方法说明与引用段落\n该专家只有一个子代理槽，可继续复用。'))}${S.messages.map(m=>m.role==='user'?`<div class="message user"><div class="messagehead">Joy</div>${esc(m.text)}${m.annotations?.length?`<div class="attachmentbar">${badge('已提交批注 '+m.annotations.length+' 条')}</div>`:''}</div>`:message('系统回执','原型',`<p>${esc(m.text)}</p>`)).join('')}</div><div class="chatbottom"><div class="worktools">${btn(`${ordered?'有序讨论':free?'自由讨论':'工作'} ${ic('down')}`,'work-mode','tiny')}${btn('秘书总结','secretary','tiny')}${btn('创建新的分支工作','branch','tiny')}<span class="spacer"></span><small>用户决定 · 专家协作</small></div>${composer()}</div></div>${side?rightPanel(side):''}</div>`}
function rightPanel(type){let title,body,bottom='';if(type==='secretary'||type==='compose'){title='会议秘书 · Corebin';body=`<div class="row tight">${badge('临时问答','fill')}${btn('项目总结','version-note','tiny')}${btn('研究导图','open-map','tiny')}</div>${S.annotations.length?`<div class="callout">本次有 ${S.annotations.length} 条标记可讨论。先问秘书会保留这些标记。</div>`:''}<div class="message" style="margin-top:22px"><div class="messagehead"><span class="avatar">C</span>Corebin</div><p style="font-size:12px">你可以把不确定的段落发给我。我会帮你解释、核对上下文，再整理成可以发送给主工作区的提示词。</p></div>${S.scratch.map(t=>`<div class="callout" style="margin:10px 0">${esc(t)}</div>`).join('')}<div class="card subtle"><h3>项目整理</h3><small>研究稿 v7 已关联版本说明与研究设计节点。</small><div class="row" style="margin-top:13px">${btn('打开说明 MD','version-note','tiny')}${btn('查看导图','open-map','tiny')}</div></div>${type==='compose'?draftCard():`<div style="margin-top:18px">${btn('组织下一步提示词','writeandsend','soft')}</div>`}`;bottom=composer('secretary','先问清楚，再决定下一步…')}
else if(type==='overview'){title='项目置顶摘要';body=`<div class="callout"><strong>当前方向</strong><br>先核查第三部分的理论表述，再决定修订范围。</div><div class="between" style="margin:21px 0 8px"><h3 style="margin:0">修改记录</h3>${badge(S.changes.length+' 项')}</div>${changesHTML()}<div class="divider"></div>${btn('打开项目工作站','workbench','soft')}`}
else if(type==='preview'){title='文件预览与批注';const v=selectedVersion();body=`<div class="between tight"><span class="mono ellipsis">${esc(v.name)}</span>${badge('v'+v.number)}</div><div class="row" style="margin:9px 0">${btn('添加选中标记','mark','tiny soft')}${btn('添加示例标记','sample-mark','tiny')}${btn('比较','diff','tiny')}</div><div class="docpaper" style="padding:18px;min-height:220px" id="preview-text" data-preview-version="${v.id}">${markdown(v.text)}</div><div class="annotations"><div class="between"><h3>本次标记 ${S.annotations.length}</h3>${btn('先问秘书','ask-secretary','tiny')}</div>${annotationList()}</div>`}
else if(type==='diff'){title='版本差异';body=`<div class="row tight">${badge('v6')}${ic('right')}${badge('v7')}</div><div class="docpaper" style="padding:18px">本文认为数字化发展<del class="diffdel">与就业韧性变化有关</del><ins class="diffadd">显著促进就业韧性提升</ins>。<p><ins class="diffadd">该表述需要与实际使用的方法和证据强度保持一致。</ins></p></div><div class="callout" style="margin-top:15px">示例版本差异。正式版将与实际文件内容对应。</div><div style="margin-top:15px">${btn('在完整页面比较','full-diff','soft')}</div>`}
else {title='本次上下文';body=contextHTML()}
return `<aside class="rightpanel"><div class="panelhead between"><h2>${title}</h2>${ib('close','close-panel','关闭侧栏')}</div><div class="panelbody">${body}</div>${bottom?`<div class="panelbottom">${bottom}</div>`:''}</aside>`}
function draftCard(){if(!S.promptDraft)preparePrompt();return `<div class="card" style="margin-top:18px"><div class="between tight"><h3 style="margin:0">writeandsend</h3>${badge('等待用户发送','warn')}</div><div class="hint">目标：${esc(S.promptTarget||S.project)} / 理论与方法核查</div><textarea id="prompt-draft" data-draft="prompt" style="min-height:170px;font-size:12px;margin-top:12px">${esc(S.drafts.prompt||S.promptDraft)}</textarea><div class="row" style="margin:10px 0">${badge('批注 '+(S.promptAnnotations||[]).length+' 条')}${btn('检查引用','annotations','tiny')}</div><div class="row">${btn('发送到主工作区','submit-prompt','primary tiny')}${btn('取消','cancel-prompt','tiny')}</div></div>`}
function changesHTML(){return S.changes.map((c,i)=>`<div class="listrow" style="align-items:flex-start"><span class="tag ${c.type==='删除'?'warn':'fill'}">${c.type}</span><div class="grow"><button class="linklike" style="padding:0;text-align:left" data-action="preview-change" data-i="${i}">${esc(c.file)}</button><div class="hint">${esc(c.detail)}</div><small>${esc(c.who)} · ${esc(c.time)}</small></div></div>`).join('')}
function selectedVersion(){return S.versions.find(v=>v.id===S.selectedVersion)||S.versions[0]}
function markdown(t){return esc(t||'').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h2>$1</h2>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}
function workbench(){return `<div class="workbench"><section class="wb-top"><div class="sectionline">全局计划 <small>记下下一步，按自己的节奏推进</small><span class="spacer"></span>${btn('查看计划','plan','tiny')}</div><div class="planstrip">${S.plans.map((p,i)=>`<button class="plancard" style="text-align:left" data-action="edit-plan" data-i="${i}"><div class="row">${ic('clock')}<strong>${esc(p.title)}</strong></div><small>${esc(p.project)} · ${esc(p.time)}</small></button>`).join('')}</div></section><section class="wb-top"><div class="sectionline">本项目日志 <small>${esc(S.project)}</small><span class="spacer"></span>${badge('关键节点')}</div><div class="journalstrip">${S.journals.map((j,i)=>`<article class="journalcard"><h3>${esc(j.title)}</h3>${['简述','文件列表','日志详情'].map(t=>`<button data-action="open-journal" data-i="${i}" data-tab="${t}">${t} ›</button>`).join('')}<span class="stamp">${j.time}</span></article>`).join('')}</div></section><div class="wb-bottom"><div class="wb-left"><div class="wb-action">${btn(ic('plus')+' 添加计划','add-plan')}${btn(ic('plus')+' 添加日志','add-journal')}</div><div class="wb-title"><span class="grow">文献版本管理</span>${ib('expand','versions','展开版本管理')}${ib('plus','upload-version','添加版本')}</div><div class="versionlist" data-drop="version">${S.versions.map(v=>`<div class="versionrow" data-action="version-select" data-id="${v.id}">${ic('file')}<div class="grow ellipsis">${esc(v.name)}<br><small>${v.note?'附说明 MD':'等待秘书'}</small></div>${ic('right')}</div>`).join('')}</div><div class="dropzone compact" data-drop="version">拖入文件 · 秘书自动整理说明<br><button class="linklike" data-action="open-folder" data-path="paper_versions">在资源管理器打开</button></div></div><div class="wb-map"><div class="wb-title">${ib('expand','open-map','打开研究导图编辑窗口')}<span class="grow">研究框架与进展</span>${badge('预览')}</div>${mapViewport(false)}${mapFoot(false)}</div><div class="wb-right"><div class="wb-title"><span class="grow">项目文件夹</span>${ib('folder','open-folder','在资源管理器打开',`data-path="project"`)}${ib('expand','files','展开文件视图')}</div><div class="filetree">${fileTreeHTML()}</div></div></div></div>`}
function fileTreeHTML(){let out='';['data','code','outputs','pipeline','mind_map','figures','latex','paper_versions','终稿'].forEach(name=>{out+=`<div class="treerow" data-action="toggle-folder" data-folder="${name}">${ic(S.fileFolders[name]?'down':'right')}${ic('folder')}<span class="grow">${name}</span></div>`;if(S.fileFolders[name]){let arr=name==='outputs'?['方法核查结果.md']:name==='mind_map'?['research.json','research.md']:name==='paper_versions'?S.versions.slice(0,3).map(v=>v.name):['说明.md'];arr.forEach(f=>out+=`<div class="treerow child" data-action="open-file" data-file="${esc(f)}">${ic('file')}<span class="ellipsis grow">${esc(f)}</span></div>`)}});out+=['投稿和附件包.zip','project-summary.md','agent.md'].map(f=>`<div class="treerow" data-action="open-file" data-file="${f}">${ic('file')}<span class="grow ellipsis">${f}</span>${ic('more')}</div>`).join('');return out}
function mapPositions(){const result=[];let y=45;const roots=S.nodes.filter(n=>!n.parent);const subtreeH=id=>{let ch=S.collapsed[id]?[]:S.nodes.filter(n=>n.parent===id);return ch.length?Math.max(68,ch.reduce((a,c)=>a+subtreeH(c.id),0)):68};function children(n,x,base){if(S.collapsed[n.id])return;let kids=S.nodes.filter(a=>a.parent===n.id),yy=base;for(let c of kids){let h=subtreeH(c.id);result.push({node:c,x:x+280,y:yy,w:228,h:Math.max(49,c.images?.length?145:49),root:false,parent:n.id});children(c,x+280,yy);yy+=h}}roots.forEach(n=>{const h=subtreeH(n.id);result.push({node:n,x:80,y:y+Math.max(0,(h-68)/2),w:172,h:68,root:true});children(n,80,y);y+=Math.max(136,h+58)});return result}
function mapViewport(edit){const pos=mapPositions(),find=id=>pos.find(p=>p.node.id===id);let paths='',roots=pos.filter(p=>p.root);roots.forEach((r,i)=>{if(i<roots.length-1){let next=roots[i+1];paths+=`<path d="M${r.x+86} ${r.y+r.h}V${next.y-7}"/><path d="m${r.x+82} ${next.y-13} 4 6 4-6"/>`}});pos.forEach(p=>{let children=pos.filter(q=>q.parent===p.node.id);if(children.length){let mid=p.y+p.h/2, x=p.x+p.w+28, first=children[0],last=children[children.length-1];paths+=`<path d="M${p.x+p.w} ${mid}H${x} M${x+14} ${first.y+16}Q${x} ${first.y+16} ${x} ${first.y+30}V${Math.max(mid-10,first.y+30)}Q${x} ${mid} ${x-10} ${mid}Q${x} ${mid} ${x} ${mid+10}V${Math.max(mid+10,last.y+last.h-16)}Q${x} ${last.y+last.h} ${x+14} ${last.y+last.h}"/>`;children.forEach(c=>paths+=`<path d="M${x+14} ${c.y+24}H${c.x}"/>`)}});
 return `<div class="mapviewport" id="mapviewport" data-edit="${edit}">${edit?'':`<span class="readbadge">缩放 / 拖动 / 展开 · 内容只读</span>`}<div class="mapscene" id="mapscene"><svg class="connections"><g fill="none" stroke="#9bac8f" stroke-width="1.5">${paths}</g></svg>${pos.map(p=>`<div class="mapnode ${p.root?'root':'secondary'} ${S.mapSelected===p.node.id?'selected':''}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;min-height:${p.h}px" data-node="${p.node.id}" data-action="select-node" tabindex="0"><div class="nodetext">${markdown(p.node.text).slice(0,600)}</div>${p.root?`<span class="nodestatus">${esc(p.node.status||'')}</span>`:''}${(p.node.images||[]).slice(0,2).map(i=>`<img class="nodeimg" src="${i.src}" alt="${esc(i.name)}">`).join('')}<button class="nodeplus" data-action="node-toggle" data-id="${p.node.id}" aria-label="${S.nodes.some(n=>n.parent===p.node.id)&&!S.collapsed[p.node.id]?'收起':'新增或展开'}分支">${S.nodes.some(n=>n.parent===p.node.id)&&!S.collapsed[p.node.id]?'−':'+'}</button></div>`).join('')}</div></div>`}
function mapFoot(edit){return `<div class="mapfoot">${ib('search','fit-map','适应画布')}<span class="spacer"></span><button data-action="zoom-out" aria-label="缩小">−</button><span id="zoomlabel">${edit?'78':'70'}%</span><button data-action="zoom-in" aria-label="放大">+</button><button data-action="fit-map">适应</button></div>`}
function mapEditor(){let n=S.nodes.find(n=>n.id===S.mapSelected)||S.nodes[0];return `<div class="editor"><div class="editortop">${ib('back','back-workbench','返回工作站')}<div><strong>研究框架与进展</strong><div class="crumb">${esc(S.project)} / mind_map/research.json</div></div><span class="spacer"></span><div class="toolbar-scroll">${ib('undo','undo-map','撤销')}${ib('redo','redo-map','重做')}${btn(ic('plus')+' 插入','map-insert','tiny')}${btn('历史','map-history','tiny optional')}${btn('导出','export-map','tiny optional')}${btn('保存并更新预览','save-map','primary tiny')}</div></div><div class="editorbody"><div class="editorcanvas">${mapViewport(true)}${mapFoot(true)}</div><aside class="editorinspector"><div class="between"><h2>内容与分支</h2>${badge(n?.parent?'分支内容':'主干节点')}</div><div class="field"><label class="label">节点内容 · Markdown</label><textarea id="node-editor" data-node-input="${n?.id}" data-drop="map" placeholder="输入内容，或拖入 Markdown / 图片…" style="min-height:170px">${esc(n?.text||'')}</textarea><div class="hint">Enter 新建同级 · Shift+Enter 块内换行<br>右键、拖入或粘贴图片 / Markdown</div></div><div class="row" style="flex-wrap:wrap">${btn('同级节点','add-sibling','tiny')}${btn('二级分支','add-child','tiny')}${btn('插入图片 / MD','map-file','tiny')}</div><div class="field"><label class="label">进展</label><select id="node-status">${['待开始','进行中','已整理','待核查','已完成'].map(s=>`<option ${n?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><div class="between"><label class="label">附件预览</label><small>${n?.images?.length||0} 个</small></div><div data-drop="map" class="dropzone" style="padding:9px">${n?.images?.length?n.images.map((i,k)=>`<img class="thumb" src="${i.src}" alt="${esc(i.name)}" style="max-width:min(100%,${S.settings.thumbW}px);max-height:${S.settings.thumbH}px" data-action="image-view" data-i="${k}"><div class="between"><small class="ellipsis">${esc(i.name)}</small>${ib('close','remove-image','移除附件',`data-i="${k}"`)}</div>`).join(''):'拖入图片到这个节点'}</div></div><div class="grid2" style="gap:8px"><div><label class="label">最大宽度</label><input type="number" id="thumb-width" min="80" max="1200" value="${S.settings.thumbW}"></div><div><label class="label">最大高度</label><input type="number" id="thumb-height" min="60" max="900" value="${S.settings.thumbH}"></div></div><div class="row" style="margin-top:18px">${btn('上移','move-up','tiny')}${btn('下移','move-down','tiny')}${btn('删除节点','delete-node','tiny')}</div><div class="divider"></div><h3>内容预览</h3><div class="mdview" id="node-md-preview">${markdown(n?.text||'')}</div><div class="hint">用户与各级 Agent 都可管理。会议秘书负责日常整理，并与版本说明 MD 互相引用。</div></aside></div><div class="editorfooter"><span class="badge-dot"></span><span id="mapsavestate">当前为浏览器内存原型 · 保存后同步预览</span><span class="spacer"></span><span>加号新增 / 展开 · 减号收起</span></div></div>`}
function versions(){return `<div class="content">${pageintro('文献版本管理','保存每一版，也保存这一版改变了什么。',btn('资源管理器打开','open-folder','',`data-path="paper_versions"`)+btn(ic('plus')+' 添加版本','upload-version','primary'))}<div class="dropzone" data-drop="version" style="margin-bottom:22px">${ic('download')}<strong>拖入文献或稿件文件</strong><div>上传后，会议秘书对照前一版本和研究上下文，为每版生成跟随说明 MD。</div><small>此原型真实读取所选文件；模型总结以可打开的说明模板演示。</small></div><div class="between" style="margin-bottom:14px"><div class="row">${badge('全部文献','fill')}${badge('研究稿')}${badge('理论说明')}${badge('方法说明')}</div><input class="searchinput" data-search="versions" placeholder="查找文件或版本…"></div><table class="table"><thead><tr><th>文件 / 文献组</th><th>版本</th><th>更新时间</th><th>秘书说明</th><th>操作</th></tr></thead><tbody>${S.versions.map(v=>`<tr data-search-row="${esc(v.name)}"><td><div class="row"><span class="fileicon">${esc(v.name.split('.').pop().toUpperCase())}</span><div><strong>${esc(v.name)}</strong><br><small>${esc(v.group)}</small></div></div></td><td>${badge('v'+v.number)}</td><td>${v.date}</td><td><span class="badge-dot"></span> ${esc(v.status)}<br><small>${esc(v.note||'等待生成')}</small></td><td>${btn('原件','version-open','tiny',`data-id="${v.id}"`)} ${btn('说明 MD','version-select','tiny',`data-id="${v.id}"`)} ${btn('比较','diff','tiny')}</td></tr>`).join('')}</tbody></table><div class="callout" style="margin-top:20px">文件位于项目的 paper_versions 目录。说明与文献版本成对出现，用户和各级 Agent 都可以阅读与管理。</div></div>`}
function versionNote(){const v=selectedVersion();const note=v.noteText||`# ${v.name} · 版本说明\n\n## 比较对象\n当前版本：${v.name}\n参考版本：${v.previous||'首版，无前序版本'}\n\n## 本次主要变化\n这是原型中的示例说明。研究设计章节增加了方法适用条件，并调整了部分理论表述。\n\n## 对研究工作的影响\n需要进一步核查理论推断与现有证据是否匹配。研究导图中的“研究设计 → 理论基础”可以据此更新。\n\n## 待用户决定\n是否先收窄措辞，再补充方法解释。\n\n## 关联材料与导图\nproject-summary.md\nmind_map/research.json → 理论基础\n\n生成者：会议秘书（示例）`;
 return `<div class="content">${pageintro('版本说明','与原件一起保存的 Markdown，连接版本差异和研究进展。',btn('打开原件','version-open','',`data-id="${v.id}"`)+btn('下载说明 MD','download-note','primary'))}<div class="grid2" style="grid-template-columns:minmax(0,1.7fr) minmax(270px,1fr)"><div class="card markdown">${markdown(note)}</div><div class="stack"><div class="card"><h3>版本关系</h3><p class="mono">${esc(v.previous||'首版')} → ${esc(v.id)}</p><small>文件：${esc(v.name)}<br>说明：${esc(v.note)}</small><div class="row" style="margin-top:16px">${btn('比较变化','diff','tiny')}${btn('重新整理','resummarize','tiny')}</div></div><div class="card"><h3>研究框架与进展</h3><p style="font-size:12px">研究设计 / 理论基础</p>${btn('定位导图节点','locate-theory','soft tiny')}<div class="hint">说明和导图互相补充。秘书组织更新，用户随时可修改。</div></div><div class="card"><h3>补充说明</h3><textarea data-draft="note" placeholder="添加你对这个版本的说明…">${esc(S.drafts.note||'')}</textarea><div style="margin-top:10px">${btn('保存补充','save-note','tiny')}</div></div></div></div></div>`}
function planPage(){return `<div class="content">${pageintro('全局计划','简单记录接下来想做的事。',btn('添加计划','add-plan','primary'))}<div class="grid3">${S.plans.map((p,i)=>`<div class="card"><div class="between"><h2 style="font-size:16px">${esc(p.title)}</h2>${ib('more','edit-plan','编辑计划',`data-i="${i}"`)}</div><p class="muted" style="font-size:12px">${esc(p.project)}</p><small>${esc(p.time)}</small><div class="row" style="margin-top:20px">${btn('开始工作','work','tiny')}${btn('完成','complete-plan','tiny',`data-i="${i}"`)}</div></div>`).join('')}</div><div class="callout" style="margin-top:22px">计划是总览级事项。填写标题即可，项目关联和备注按需补充。</div></div>`}
function journalPage(){let j=S.journals[S.journalIndex??(S.journals.length-1)]||S.journals[0];return `<div class="content">${pageintro(j.title,'本项目日志 · '+S.project,btn('返回工作站','workbench'))}<div class="tabs"><button class="tab active" data-action="journal-tab" data-tab="简述">简述</button><button class="tab" data-action="journal-tab" data-tab="文件列表">文件列表</button><button class="tab" data-action="journal-tab" data-tab="日志详情">日志详情</button></div><div class="grid2" style="grid-template-columns:1.6fr 1fr"><div class="card"><div id="journal-detail"><h2>完成了什么</h2><p>${esc(j.text)}</p><p>当前重点是保持理论陈述、使用的方法与实际证据一致。需要用户决定的修改范围已留在工作聊天中。</p><h3>相关材料</h3>${artifact()}<div class="row" style="margin-top:18px">${btn('打开相关聊天','work','tiny')}${btn('查看逐次修改','overview','tiny')}</div></div></div><div class="stack"><div class="card"><h3>节点信息</h3><p style="font-size:12px">时间：${j.time}<br>整理者：会议秘书<br>所属项目：${esc(S.project)}</p></div><div class="card"><h3>补充说明</h3><textarea data-draft="journal" placeholder="补充重要背景或完成情况…"></textarea><div style="margin-top:10px">${btn('保存补充','save-journal-note','tiny')}</div></div></div></div></div>`}

function mapHistory(){return `<div class="content">${pageintro('导图更新历史','把结构变化与版本说明连接起来。',btn('返回编辑器','map','primary'))}<div class="grid2"><div class="card"><h2>最近更新</h2>${S.mapHistory.map((h,i)=>`<div class="timelineitem"><div class="between"><strong>${esc(h.label)}</strong><small>${h.time}</small></div><p class="hint">来源：${esc(h.source)}</p>${btn('查看导图','map','tiny')} ${btn('相关说明','version-note','tiny')}</div>`).join('')}</div><div class="card"><h2>协作更新</h2><p>会议秘书根据新的版本说明整理研究框架。用户也可以在 GUI 中修改相同内容。</p><div class="callout">若你正在编辑某个节点，保留当前输入并展示其他 Agent 的更新，再选择采用或继续编辑。</div><div class="row" style="margin-top:20px">${btn('查看节点内容','map-rich','tiny')}${btn('打开版本说明','version-note','tiny')}</div></div></div></div>`}

function contentForRoute(){if(route==='home')return home();if(['work','free','ordered','secretary','compose','overview','preview','context'].includes(route))return chat();if(route==='diff')return S.fullDiff?fullDiffPage():chat();if(route==='workbench')return workbench();if(route==='plan')return planPage();if(route==='journal')return journalPage();if(route==='versions')return versions();if(route==='version-note')return versionNote();if(route==='files')return filesPage();if(['database','library','sources'].includes(route))return databasePage();if(route==='resource')return resourcePage();if(route==='browser')return browserPage();if(route==='quick')return quickPage();if(route==='assistant')return quickPage(true);if(route==='projects')return projectsPage();if(route==='project-new')return newProject();if(route==='branch')return branchPage();if(settingsRoutes.includes(route)||['provider','plugin'].includes(route))return settingsPage();if(route==='help')return helpPage();if(route==='resume')return resumePage();if(route==='welcome')return welcomePage();if(route==='run')return runPage();if(route==='map-history')return mapHistory();return helpPage()}
function render(){route=loadRoute();document.title=current().id+' '+current().title+' · ScienceScope';const map=route==='map'||route==='map-rich';if(route==='map-rich'&&!S.mapRichVisited){S.mapSelected='routeimg';S.mapRichVisited=true}document.body.innerHTML=`<div id="app">${topbar()}${map?mapEditor():`<div class="app">${sidebar()}<main class="main">${mainhead()}<div class="mainbody">${contentForRoute()}</div></main></div>`}${footer()}</div>`;bindSpecial();if($('#mapviewport')){if(!window._lastMapRoute||window._lastMapRoute!==route)mapView=map?{x:55,y:25,scale:.78}:{x:6,y:10,scale:.70};window._lastMapRoute=route;applyMapView()}}
function preparePrompt(){S.promptTarget=S.project;S.promptAnnotations=clone(S.annotations);S.promptDraft=`请围绕${S.project}的当前稿件，先检查理论表述与方法、证据是否一致。\n\n${S.annotations.length?S.annotations.map((a,i)=>`${i+1}. 关于“${a.quote}”：${a.note||'请解释并提出具体建议。'}`).join('\n'):'重点查看第三部分。先给出问题、依据和修改建议，由我决定采用范围。'}\n\n请保留原意，说明实际修改了什么，并让会议秘书同步版本说明与研究导图。`;S.drafts.prompt=S.promptDraft}
function addAnnotation(quote,note=''){const v=selectedVersion();S.annotations.push({id:uid('ann'),rev:1,quote,file:v.name,version:v.id,note});render();toast('已添加临时标记。可以继续选择其他片段。')}
async function submitMain(text,annotations){let captured=clone(annotations||S.annotations);const ids=captured.map(a=>a.id+':'+a.rev);if(!text.trim()&&!captured.length){toast('先输入问题或添加批注。');return}toast('正在接收本次演示提交…');await new Promise(r=>setTimeout(r,380));S.messages.push({role:'user',text,annotations:captured});S.submitted.push({id:uid('request'),text,annotations:captured,projectId:S.projectId,time:new Date().toISOString()});S.formalCount++;S.annotations=S.annotations.filter(a=>!ids.includes(a.id+':'+a.rev));S.drafts.main='';S.messages.push({role:'system',text:'已接收本次原型消息与批注快照。正式版将在这里调用 DSH；当前没有模型运行。'});go('work');render();$('.messages')?.scrollTo(0,$('.messages').scrollHeight);toast('主工作区已接收。本次提交的标记已清除，可从该消息追溯。')}
function captureMap(){undoStack.push(clone(S.nodes));if(undoStack.length>50)undoStack.shift();redoStack=[]}
function mapChanged(label='编辑导图'){S.mapHistory.unshift({label,source:'GUI 编辑',time:'刚刚'});render();$('#mapsavestate')&&( $('#mapsavestate').textContent='已编辑 · 点击保存并更新预览');}
function addNode(parent,siblingId){captureMap();let id=uid('node');let n={id,parent:parent??null,text:parent?'新的内容':'新的研究节点',status:parent?'':'待开始',images:[]};let idx=siblingId?S.nodes.findIndex(x=>x.id===siblingId):-1;if(idx>=0)S.nodes.splice(idx+1,0,n);else S.nodes.push(n);if(parent)S.collapsed[parent]=false;S.mapSelected=id;mapChanged(parent?'新增分支内容':'新增主干节点');setTimeout(()=>{$('#node-editor')?.focus();$('#node-editor')?.select()},30)}
function applyMapView(){const scene=$('#mapscene');if(scene)scene.style.transform=`translate(${mapView.x}px,${mapView.y}px) scale(${mapView.scale})`;if($('#zoomlabel'))$('#zoomlabel').textContent=Math.round(mapView.scale*100)+'%'}
function zoom(d){mapView.scale=Math.max(.2,Math.min(2.2,mapView.scale*d));applyMapView()}
function fitMap(){const vp=$('#mapviewport');if(!vp)return;const pos=mapPositions();const maxX=Math.max(...pos.map(p=>p.x+p.w))+35,maxY=Math.max(...pos.map(p=>p.y+p.h))+35;mapView={x:18,y:18,scale:Math.max(.2,Math.min(1,(vp.clientWidth-36)/maxX,(vp.clientHeight-36)/maxY))};applyMapView()}
function mapMarkdown(){function node(n,depth){return `${'  '.repeat(depth)}- ${n.text.replace(/\n/g,'\n'+'  '.repeat(depth+1))}${n.status?' ['+n.status+']':''}\n${(n.images||[]).map(i=>'  '.repeat(depth+1)+'图片：'+i.name+'\n').join('')}${S.nodes.filter(x=>x.parent===n.id).map(x=>node(x,depth+1)).join('')}`}return '# 研究框架与进展\n\n'+S.nodes.filter(n=>!n.parent).map(n=>node(n,0)).join('')}
function exportBlob(name,content,type='text/plain;charset=utf-8'){const blob=content instanceof Blob?content:new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),15000)}
function readFile(file,asData=false){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;asData?r.readAsDataURL(file):r.readAsText(file)})}
function chooseFiles(kind){const el=document.createElement('input');el.type='file';el.multiple=true;if(kind==='map')el.accept='.md,.markdown,.txt,image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif';el.onchange=()=>handleFiles([...el.files],kind);el.click()}
async function handleFiles(files,kind,targetNode){if(!files.length)return;try{if(kind==='map'){let n=S.nodes.find(x=>x.id===(targetNode||S.mapSelected));if(!n)return;captureMap();for(let f of files){if(f.type.startsWith('image/')){let src=await readFile(f,true);n.images.push({name:f.name,src})}else if(/\.(md|markdown|txt)$/i.test(f.name)){const txt=await readFile(f);n.text=(n.text?n.text+'\n\n':'')+txt}else{toast('这个输入框支持 Markdown、文本和常见图片。')}}mapChanged('插入 Markdown / 图片');toast('内容已放入选定节点。缩略图保持比例。');return}
 if(kind==='version'){for(let file of files){let prev=S.versions.find(v=>v.group==='研究稿'),v={id:uid('version'),name:file.name,group:S.importGroup||'研究稿',number:(prev?.number||0)+1,date:'刚刚',previous:prev?.id||null,note:file.name.replace(/\.[^.]+$/,'')+'.notes.md',status:'说明模板就绪（原型）'};if(/\.(md|markdown|txt|tex|py|r|csv)$/i.test(file.name))v.text=await readFile(file);v.noteText=`# ${file.name} · 版本说明\n\n状态：说明模板已创建，等待正式版会议秘书读取与总结。\n\n## 文件与比较对象\n当前文件：${file.name}\n大小：${file.size} 字节\n前一版本：${prev?.name||'首版，无前序版本'}\n项目：${S.project}\n\n## 本次变化\n${v.text?'原型已读取文本，可供正式版与前一版对比。':'原件已接收，需对应格式读取工具提取内容。'}\n\n## 与前文上下文的关系\n正式版使用导入时选定的项目摘要与相关讨论。\n\n## 待用户决定\n由会议秘书整理后填写。\n\n## 相关研究导图\nmind_map/research.json\n\n此说明为可用的本地模板，不是 AI 已经完成的总结。`;S.versions.unshift(v);S.selectedVersion=v.id;filesMemory.set(v.id,file);S.changes.unshift({type:'创建',file:file.name,detail:'导入文献版本；说明模板已关联',who:'Joy',time:'刚刚'})}render();toast(`已导入 ${files.length} 个文件，并创建对应说明模板。正式版在此触发秘书总结。`);return}
 if(kind==='project'){S.extraFiles=S.extraFiles||[];for(let f of files){S.extraFiles.push(f.name);filesMemory.set(f.name,f);S.changes.unshift({type:'创建',file:f.name,detail:'用户导入项目文件',who:'Joy',time:'刚刚'})}render();toast('已加入原型项目文件列表。');return}
 S.contextRefs=(S.contextRefs||[]).concat(files.map(f=>({name:f.name})));render();toast('文件已加入本次上下文演示。');}catch(e){toast('文件读取失败：'+e.message)}}
function openFile(name){let local=filesMemory.get(name)||filesMemory.get(S.selectedVersion);modal('打开文件',`<p>文件：<strong>${esc(name||selectedVersion().name)}</strong></p><p class="muted" style="font-size:12px">正式桌面版在此调用操作系统默认程序。本原型可以预览文本或导出文件，便于检查交互。</p><div class="row">${btn('在右侧预览','preview','primary')}${btn('导出文件副本','download-current')}${btn('查看版本','versions')}</div>`)}
function openFolder(path){let base='<安装目录>/data/projects/'+S.projectId;let full=path==='project'?base:base+'/'+(path||'');modal('在文件资源管理器打开',`<p class="mono codebox">${esc(full)}</p><p class="muted" style="font-size:12px">正式桌面版打开这个实际目录。浏览器原型展示路径与入口，系统文件夹调用交给本地桌面宿主。</p><div class="row">${btn('复制路径','copy-path','primary',`data-path="${esc(full)}"`)}${btn('在原型中浏览','files')}</div>`)}

function editPlan(index){let p=S.plans[index]||{title:'',project:'全局计划'};modal(index===undefined?'添加计划':'编辑计划',`${field('计划标题',p.title,'text','plan-title')}${field('关联项目（可选）',p.project,'text','plan-project')}<div class="field"><label class="label">备注（可选）</label><textarea id="plan-note"></textarea></div><div class="saverow">${btn('取消','close-modal')}${btn('保存计划','save-plan','primary',`data-i="${index??''}"`)}</div>`)}
function exportState(){return clone(S)}
function receiveMap(payload){S.nodes=clone(payload.nodes);S.collapsed=clone(payload.collapsed||{});S.mapHistory=clone(payload.mapHistory||S.mapHistory);if(['workbench','map','map-rich','map-history'].includes(route))render();toast('研究导图已同步。')}
function openMapWindow(){const url=location.href.split('#')[0]+'#map';const child=window.open(url,'ScienceScopeResearchMap','width=1320,height=900');if(!child){go('map');toast('浏览器阻止新窗口，已在当前页打开编辑器。')}else toast('已打开二级导图编辑窗口。')}
function bindSpecial(){const vp=$('#mapviewport');if(vp){vp.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey){let rect=vp.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,old=mapView.scale;zoom(e.deltaY>0?.92:1.08);mapView.x=mx-(mx-mapView.x)*mapView.scale/old;mapView.y=my-(my-mapView.y)*mapView.scale/old}else{mapView.x-=e.deltaX;mapView.y-=e.deltaY}applyMapView()},{passive:false});let drag=null;vp.addEventListener('pointerdown',e=>{if(e.target.closest('.mapnode')||e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,mx:mapView.x,my:mapView.y};vp.setPointerCapture(e.pointerId)});vp.addEventListener('pointermove',e=>{if(!drag)return;mapView.x=drag.mx+e.clientX-drag.x;mapView.y=drag.my+e.clientY-drag.y;applyMapView()});vp.addEventListener('pointerup',()=>drag=null);vp.addEventListener('pointercancel',()=>drag=null)}
 const preview=$('#preview-text');if(preview){preview.addEventListener('mouseup',()=>{let sel=window.getSelection();if(sel&&sel.toString().trim()&&preview.contains(sel.anchorNode)){selectedQuote=sel.toString().trim();selectionVersion=preview.dataset.previewVersion}})}
}

 if(SPECS.some(p=>p.route===a)){if(a==='plugin')S.pluginName=el.dataset.plugin;$('#modal')?.remove();go(a);return}

 case 'settings':go('general');break;

 case 'top-menu':modal(['文件','编辑','视图'][+el.dataset.menu],`<div class="stack">${(+el.dataset.menu===0?[['project-new','创建项目'],['files','打开项目文件夹'],['versions','导入文献版本']]:+el.dataset.menu===1?[['map','研究导图编辑'],['preview','文件预览与批注'],['persona','共同提示']]:[['workbench','项目工作站'],['secretary','会议秘书'],['browser','内置浏览器'],['help','页面目录']]).map(([r,t])=>btn(t,r)).join('')}</div>`);break;
 case 'switch-project':switchProject(el.dataset.project);$('#modal')?.remove();go('workbench');render();break;
 case 'open-chat':{let oldKey=S.projectId+':'+(S.chatName||'理论与方法核查');chatBuckets[oldKey]={messages:clone(S.messages),draft:S.drafts.main||''};switchProject(el.dataset.project);S.chatName=el.dataset.chat;let c=chatBuckets[S.projectId+':'+S.chatName];S.messages=c?.messages||[];S.drafts.main=c?.draft||'';go('work');render();break;}
 case 'new-chat':modal('创建项目内聊天',`${field('聊天名称','','text','chat-title')}<small>项目：${esc(S.project)}</small><div class="saverow">${btn('创建','create-chat','primary')}</div>`);break;
 case 'create-chat':S.chatName=$('#chat-title').value||'新聊天';S.messages=[];$('#modal').remove();go('work');render();toast('新聊天已创建。');break;
 case 'project-menu':modal('项目操作',`<div class="stack">${btn('查看项目','workbench')}${btn('创建聊天','new-chat')}${btn('重命名','rename-project')}${btn('置顶 / 归档','archive-project')}${btn('打开文件夹','open-folder','',`data-path="project"`)}</div>`);break;
 case 'rename-project':modal('重命名项目',`${field('名称',S.project,'text','rename-project-value')}${btn('保存','save-project-name','primary')}`);break;

 case 'set-mode':S.settings.mode=el.dataset.mode;render();break;

document.addEventListener('input',e=>{let t=e.target;if(t.dataset.draft)S.drafts[t.dataset.draft]=t.value;if(t.dataset.annotationNote){let a=S.annotations.find(a=>a.id===t.dataset.annotationNote);if(a){a.note=t.value;a.rev++}}if(t.dataset.nodeInput){let n=S.nodes.find(n=>n.id===t.dataset.nodeInput);if(n){n.text=t.value;if($('#node-md-preview'))$('#node-md-preview').innerHTML=markdown(n.text);let on=$(`[data-node="${n.id}"] .nodetext`);if(on)on.innerHTML=markdown(n.text)}}if(t.dataset.search){let text=t.value.toLowerCase();$$('[data-search-row]').forEach(r=>r.style.display=r.dataset.searchRow.toLowerCase().includes(text)?'':'none')}});
document.addEventListener('focusin',e=>{if(e.target.dataset.nodeInput){editingBefore=clone(S.nodes)}});
document.addEventListener('focusout',e=>{if(e.target.dataset.nodeInput&&editingBefore){if(JSON.stringify(editingBefore)!==JSON.stringify(S.nodes)){undoStack.push(editingBefore);redoStack=[];S.mapHistory.unshift({label:'编辑节点内容',source:'GUI 编辑',time:'刚刚'})}editingBefore=null}});
document.addEventListener('change',e=>{if(e.target.id==='node-status'){captureMap();S.nodes.find(n=>n.id===S.mapSelected).status=e.target.value;mapChanged('更新节点进展')}if(e.target.id==='thumb-width'||e.target.id==='thumb-height'){S.settings.thumbW=Math.max(80,Math.min(1200,+$('#thumb-width').value||280));S.settings.thumbH=Math.max(60,Math.min(900,+$('#thumb-height').value||180));render()}});
document.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;const t=e.target;if(e.key==='Escape'){ $('#modal')?.remove();$('.contextmenu')?.remove();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();go('projects');return}if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='n'){e.preventDefault();window.open(location.href.split('#')[0]+'#quick','ScienceScopeQuick','width=630,height=780');return}
if(t.dataset.nodeInput){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();let n=S.nodes.find(n=>n.id===t.dataset.nodeInput);editingBefore=null;addNode(n.parent,n.id);return}if(e.key==='Tab'){e.preventDefault();editingBefore=null;addNode(t.dataset.nodeInput);return}}
if(['map','map-rich'].includes(route)){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('[data-action="save-map"]')?.click();return}if(!(t.matches('input,textarea')||t.isContentEditable)&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$(`[data-action="${e.shiftKey?'redo-map':'undo-map'}"]`)?.click();return}}
if(t.dataset.draft&&t.dataset.draft!=='prompt'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$(`[data-action="send"][data-scope="${t.dataset.draft}"]`)?.click()}});
document.addEventListener('dblclick',e=>{const node=e.target.closest('[data-node]');if(node&&['map','map-rich'].includes(route)){$('#node-editor')?.focus();$('#node-editor')?.select()}});
document.addEventListener('contextmenu',e=>{const edit=['map','map-rich'].includes(route),node=e.target.closest('[data-node]');if(!edit||(!node&&!e.target.closest('[data-node-input]')&&!e.target.closest('[data-drop="map"]')))return;e.preventDefault();if(node){S.mapSelected=node.dataset.node;render()}$('.contextmenu')?.remove();const d=document.createElement('div');d.className='contextmenu';d.style.left=Math.min(e.clientX,innerWidth-220)+'px';d.style.top=Math.min(e.clientY,innerHeight-240)+'px';d.innerHTML=`<button data-action="map-file">插入 Markdown / 图片…</button><button data-action="add-sibling">新建同级元素　Enter</button><button data-action="add-child">添加二级分支　Tab</button><button data-action="move-up">上移</button><button data-action="delete-node">删除节点</button>`;document.body.appendChild(d)});
document.addEventListener('dragover',e=>{let z=e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.add('dragover')}});
document.addEventListener('dragleave',e=>{e.target.closest('[data-drop]')?.classList.remove('dragover')});
document.addEventListener('drop',e=>{let z=e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.remove('dragover');handleFiles([...e.dataTransfer.files],z.dataset.drop,z.dataset.nodeInput)}});
document.addEventListener('paste',e=>{if(!['map','map-rich'].includes(route))return;const t=e.target;if(!t.closest('[data-node-input]')&&!t.closest('[data-drop="map"]'))return;let files=[...(e.clipboardData?.files||[])];if(files.length){e.preventDefault();handleFiles(files,'map',t.dataset.nodeInput)}});
window.addEventListener('hashchange',render);
window.SS={getState:()=>S,exportData:exportState,receiveMap,reset:()=>{S=initial();render()},navigate:go,addAnnotation,handleFiles,submitMain,render};
try{if(window.opener?.SS){const parent=window.opener.SS.exportData();S.nodes=parent.nodes;S.collapsed=parent.collapsed;S.mapHistory=parent.mapHistory;S.project=parent.project;S.projectId=parent.projectId;S.mapSelected=parent.mapSelected;S.settings.thumbW=parent.settings.thumbW;S.settings.thumbH=parent.settings.thumbH}}catch{}
try{window.mapChannel=new BroadcastChannel('sciencescope-design-map');window.mapChannel.onmessage=e=>receiveMap(e.data)}catch{}
render();
</script></body></html>
